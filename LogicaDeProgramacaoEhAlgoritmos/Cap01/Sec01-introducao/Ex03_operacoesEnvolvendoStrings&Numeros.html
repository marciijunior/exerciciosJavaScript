<script>
  const num = "20";

  const mult = num * 5;
  const minus = num - 5;
  const div = num / 5;
  const soma = num + 5;
  const numeroTransformado = Number(num) + 5;


  console.log("Multiplicação: " + mult);
  console.log("Subtração: " + minus);
  console.log("Divisão: " + div);
  console.log("Soma: " + soma);
  console.log("Número transformado: " + numeroTransformado);
  
  // Em todas as operações, exceto na soma, o JavaScript converteu a string "20" para o número. Na soma, ele concatenou a string "20" com o número 5, resultando na string "205".
</script>
