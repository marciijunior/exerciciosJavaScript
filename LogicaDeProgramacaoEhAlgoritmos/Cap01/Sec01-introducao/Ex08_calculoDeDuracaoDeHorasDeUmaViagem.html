<script>
  const entradaDias = Number(prompt("Quantos dias durou sua viagem?"));
  const entradaHoras = Number(prompt("Quantas horas durou sua viagem?"));
  const conversaoDeDias = entradaDias * 24;
  const tempoTotal = conversaoDeDias + entradaHoras;
  alert(`Sua viagem durou ${tempoTotal} horas.`);
</script>
