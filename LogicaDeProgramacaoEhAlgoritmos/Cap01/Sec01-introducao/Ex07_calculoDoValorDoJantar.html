<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
<script>
  const totalBruto = Number(prompt("Digite o valor da sua conta:"));
  const garcom = totalBruto * 0.1;
  const totalLimpo = garcom + totalBruto;

  alert(
    `Taxa garçom: ${garcom.toFixed(2)} 
    \nTotal: ${totalLimpo.toFixed(2)}`
  );
</script>
