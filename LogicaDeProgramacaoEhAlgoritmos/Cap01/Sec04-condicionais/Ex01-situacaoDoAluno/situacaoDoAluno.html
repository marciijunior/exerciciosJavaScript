<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Situacao do Aluno</title>
  </head>
  <body>
    <h1>Situacao do Aluno</h1>
    <form>
      <p>Nome do aluno: <input type="text" id="inNome" required /></p>
      <p>Primeira Nota: <input type="text" step="0.1" min="0" max="10" id="inPrimeiraNota" required /></p>
      <p>Segunda Nota: <input type="text" step="0.1" min="0" max="10" id="inSegundaNota" required /></p>
      <input type="submit" value="Exibir média e situação" />
    </form>
    <h3></h3>
    <h4></h4>
    <script src="situacaoDoAluno.js"></script>
  </body>
</html>
