<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcular o peso ideal!</title>
  </head>
  <body>
    <form>
      <h1>Programa para calcular o peso!</h1>
      <p>Nome: <input type="text" id="inNome"/></p>
      <p>
        Sexo:
        <input type="radio" name="sexo" id="inMasculino" required />Masculino
        <input type="radio" name="sexo" id="inFeminino" required />Feminino
      </p>
      <p>
        Altura:
        <input type="number" id="inAltura" min="0" step="0.01" required />
      </p>
      <p>
        <input type="submit" value="Calcular o peso ideal" />
        <input type="reset" value="Limpar dados" />
      </p>
    </form>
    <h3></h3>
    <h4></h4>
    <script src="calculoDePeso.js"></script>
    </body>
</html>
