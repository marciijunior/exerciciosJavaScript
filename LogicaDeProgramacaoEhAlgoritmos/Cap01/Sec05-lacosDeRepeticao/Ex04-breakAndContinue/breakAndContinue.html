<!-- Break sai do laço de repetição, enquanto o continue volta ao início do laço. -->
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break e Continue</title>
  </head>
  <body>
    <script>
      alert("Digite 0 para sair");
      do {
        const entrada = prompt("Digite um valor positivo e numérico:");
        const num = Number(entrada);
        if (num === 0 || isNaN(num)) {
          const sair = confirm("Confirmar saída?");
          if (sair === true) {
            break;
          } else {
            continue;
          }
        }
        if (num % 2 === 0) {
          alert(`O dobro de ${num} é: ${num * 2}`);
        } else {
          alert(`O triplo de ${num} é: ${num * 3}`);
        }
      } while (true);
      alert("Bye, bye...");
    </script>
  </body>
</html>
