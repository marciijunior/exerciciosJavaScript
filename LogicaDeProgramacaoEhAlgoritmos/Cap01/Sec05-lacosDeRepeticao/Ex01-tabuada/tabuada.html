<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabuada</title>
  </head>
  <body>
    <form>
      <p>
        Digite um número para ser sua tabuada:
        <input type="number" id="inNumero" min="0" max="1000" step="1" />
      </p>
      <p><input type="submit" value="Clique aqui para calcular a tabuada" /></p>
      <pre></pre>
    </form>
    <script>
      const frm = document.querySelector("form");
      const respostaFinal = document.querySelector("pre");

      frm.addEventListener("submit", (e) => {
        e.preventDefault();
        const numero = Number(frm.inNumero.value);
        let resultado = "";
        for (let i = 1; i <= 10; i++) {
          resultado += `${numero} x ${i} = ${numero * i}\n`;
        }
        respostaFinal.innerText = resultado;
      });
    </script>
  </body>
</html>
