<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor de Texto</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="container">
      <h2>Digite seu texto</h2>
      <textarea
        id="editor"
        placeholder="Use **texto** para negrito e __texto__ para sublinhado..."
      ></textarea>
      <h2>Seu texto:</h2>
      <div id="caixaTexto" class="caixaTextoVisao"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
